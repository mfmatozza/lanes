# Builds the Dockerfile and checks that the MCP server in it starts and answers introspection (what MCP directories test).
name: docker
on:
  pull_request:
    paths: ["Dockerfile", "packages/**", "package*.json", ".github/workflows/docker.yml"]
  push:
    branches: [main]
    paths: ["Dockerfile", "packages/**", "package*.json", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lanes-mcp .
      - name: initialize and tools/list over stdio
        run: |
          set -euo pipefail
          out=$(printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | timeout 30 docker run -i --rm lanes-mcp)
          echo "$out"
          echo "$out" | grep -q '"serverInfo"' || { echo "no initialize answer"; exit 1; }
          n=$(echo "$out" | grep '"id":2' | grep -o '"name":"team_[a-z_]*"' | wc -l)
          test "$n" -eq 7 || { echo "expected 7 tools, got $n"; exit 1; }
