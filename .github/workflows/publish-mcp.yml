# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io) as io.github.mfmatozza/lanes.
# Run it by hand after a release whose .mcpb is attached, with server.json pointing at that file and its SHA-256.
# GitHub's OIDC token proves the namespace: no secret is stored or sent.
name: publish-mcp
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'mfmatozza/lanes'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4

      - name: Check the bundle server.json points at
        run: |
          set -euo pipefail
          url=$(jq -r '.packages[0].identifier' server.json)
          want=$(jq -r '.packages[0].fileSha256' server.json)
          curl --fail --location --silent --show-error --output bundle.mcpb "$url"
          got=$(sha256sum bundle.mcpb | cut -d' ' -f1)
          test "$got" = "$want" || { echo "SHA-256 of $url is $got, server.json says $want"; exit 1; }

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
